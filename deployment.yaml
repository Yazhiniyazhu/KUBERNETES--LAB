apiVersion: apps/v1
kind: Deployment
metadata:
  name: set11-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: set11-app
  template:
    metadata:
      labels:
        app: set11-app
    spec:
      containers:
      - name: web
        image: set11-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: set11-service
spec:
  type: NodePort
  selector:
    app: set11-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30011
